name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview version bumps without writing commits, tags, or releases
        type: boolean
        default: false

jobs:
  release:
    name: Release
    if: github.actor == 'schimanko'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: create-portfoliable/package-lock.json

      - name: Import GPG key for verified commits and tags
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -z "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "RELEASE_GPG_PRIVATE_KEY not set; proceeding without signed release commit/tag"
            echo "RELEASE_SIGN=false" >> $GITHUB_ENV
            exit 0
          fi
          if printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | base64 --decode > /tmp/release-private-key.asc 2>/dev/null; then
            true
          else
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > /tmp/release-private-key.asc
          fi
          gpg --batch --import /tmp/release-private-key.asc
          KEY_ID="$RELEASE_GPG_KEY_ID"
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2}' | awk -F/ '{print $2}' | head -n 1)
          fi
          if [ -z "$KEY_ID" ]; then
            echo "Could not determine signing key id"
            exit 1
          fi
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true
          git config tag.gpgsign true
          echo "RELEASE_SIGN=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm --prefix ./create-portfoliable ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm --prefix ./create-portfoliable run build

      - name: Packed artifact smoke
        run: npm --prefix ./create-portfoliable run smoke:packed

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./create-portfoliable/dist

      - name: Configure git
        run: |
          git config user.name "schimanko"
          git config user.email "schimanko@users.noreply.github.com"

      - name: Compute release plan and apply versions
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> $GITHUB_OUTPUT
            node ./create-portfoliable/scripts/release-orchestrator.mjs --dry-run
          else
            echo "dry_run=false" >> $GITHUB_OUTPUT
            node ./create-portfoliable/scripts/release-orchestrator.mjs
          fi

      - name: Publish create-portfoliable to npm
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          cd create-portfoliable
          npm publish --provenance --access public

      - name: Push release commit and tags
        if: steps.release-plan.outputs.released_any == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub release for create-portfoliable
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release-plan.outputs.package_tag }}"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"generate_release_notes\":true}"

  deploy-pages:
    name: Release
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: Release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Release artifact
        id: deployment
        uses: actions/deploy-pages@v4
