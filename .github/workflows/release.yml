# File: .github/workflows/release.yml
# Purpose: Automate version planning, package publish, and release tagging for create-portfoliable.
# Author: Lio Schimanko

# MARK: WORKFLOW NAME
name: Release create-portfoliable

# MARK: TRIGGERS
on:
  push:
    branches:
      - main

      # MARK: RELEASE JOB
jobs:
  release:
    name: Release create-portfoliable
    if: github.actor == 'schimanko'
    runs-on: ubuntu-latest
    environment:
      name: Packages
      url: https://www.npmjs.com/package/create-portfoliable
    permissions:
      contents: write
      id-token: write
      packages: write

    # MARK: RELEASE STEPS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: create-portfoliable/package-lock.json
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Import GPG key for verified commits and tags
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -z "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "RELEASE_GPG_PRIVATE_KEY not set; proceeding without signed release commit/tag"
            echo "RELEASE_SIGN=false" >> $GITHUB_ENV
            exit 0
          fi
          if printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | base64 --decode > /tmp/release-private-key.asc 2>/dev/null; then
            true
          else
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > /tmp/release-private-key.asc
          fi
          gpg --batch --import /tmp/release-private-key.asc
          KEY_ID="$RELEASE_GPG_KEY_ID"
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2}' | awk -F/ '{print $2}' | head -n 1)
          fi
          if [ -z "$KEY_ID" ]; then
            echo "Could not determine signing key id"
            exit 1
          fi
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true
          git config tag.gpgsign true
          echo "RELEASE_SIGN=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm --prefix ./create-portfoliable ci

      - name: Verify package identity
        run: |
          PACKAGE_NAME=$(npm --prefix ./create-portfoliable pkg get name | tr -d '"')
          if [ "$PACKAGE_NAME" != "create-portfoliable" ]; then
            echo "Expected package name create-portfoliable but found: $PACKAGE_NAME"
            exit 1
          fi

      - name: Build
        run: npm --prefix ./create-portfoliable run build

      - name: Packed artifact smoke
        run: npm --prefix ./create-portfoliable run smoke:packed

      - name: Configure git
        run: |
          git config user.name "schimanko"
          git config user.email "schimanko@users.noreply.github.com"

      - name: Compute release plan and apply versions
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> $GITHUB_OUTPUT
            echo "Running release dry-run for create-portfoliable"
            node ./create-portfoliable/scripts/release-orchestrator.mjs --dry-run
          else
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "Running release plan for create-portfoliable"
            node ./create-portfoliable/scripts/release-orchestrator.mjs
          fi

      - name: Debug release plan outputs
        if: always()
        run: |
          echo "dry_run=${{ steps.release-plan.outputs.dry_run }}"
          echo "released_any=${{ steps.release-plan.outputs.released_any }}"
          echo "released_package=${{ steps.release-plan.outputs.released_package }}"
          echo "package_version=${{ steps.release-plan.outputs.package_version }}"
          echo "package_tag=${{ steps.release-plan.outputs.package_tag }}"

      - name: Push release commit and tags
        if: steps.release-plan.outputs.released_any == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          git push origin main
          git push origin --tags

      - name: Upgrade npm for OIDC Trusted Publishing
        if: steps.release-plan.outputs.dry_run != 'true'
        run: |
          npm install -g npm@latest
          hash -r

      - name: Diagnostics for npm trusted publishing
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./create-portfoliable/package.json').name")
          echo "package=$PACKAGE_NAME"
          echo "registry=$(npm config get registry)"
          npm ping || true
          REGISTRY="$(npm config get registry)"
          if [ "$REGISTRY" != "https://registry.npmjs.org/" ] && [ "$REGISTRY" != "https://registry.npmjs.org" ]; then
            echo "Unexpected npm registry: $REGISTRY"
            exit 1
          fi

      - name: Final npm version guard
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          VERSION=$(node -p "require('./create-portfoliable/package.json').version")
          PUBLISHED="$(npm view create-portfoliable versions --json 2>/dev/null || echo '[]')"
          echo "guard_version=$VERSION"
          echo "guard_registry_versions_json=$PUBLISHED"
          export PUBLISHED
          node -e 'const version = process.argv[1]; const published = JSON.parse(process.env.PUBLISHED || "[]"); if (published.includes(version)) { console.error("Version already exists on npm registry: " + version); process.exit(1); }' "$VERSION"
          echo "guard_decision=proceeding with npm publish for version $VERSION"

      - name: Publish create-portfoliable to npm
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          cd create-portfoliable
          npm publish --provenance --access public --registry https://registry.npmjs.org/

      - name: Detect GitHub Packages publish eligibility
        id: package-targets
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./create-portfoliable/package.json').name")
          echo "package_name=$PACKAGE_NAME"
          if [[ "$PACKAGE_NAME" == @* ]]; then
            echo "github_packages=true" >> "$GITHUB_OUTPUT"
            echo "Scoped package detected; GitHub Packages publish is allowed."
          else
            echo "github_packages=false" >> "$GITHUB_OUTPUT"
            echo "Unscoped package detected; skipping GitHub Packages publish to avoid duplicate package publication."
          fi

      - name: Setup GitHub Packages publishing
        if: steps.package-targets.outputs.github_packages == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@portfoliablejs'

      - name: Publish create-portfoliable to GitHub Packages
        if: steps.package-targets.outputs.github_packages == 'true'
        run: |
          cd create-portfoliable
          npm config set "@portfoliablejs:registry" "https://npm.pkg.github.com"
          npm publish --registry https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release for create-portfoliable
        if: steps.release-plan.outputs.released_package == 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release-plan.outputs.package_tag }}"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"generate_release_notes\":true}"

