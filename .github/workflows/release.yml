name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Initializer smoke
        run: npm run smoke:initializer

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release @portfoliablejs/portfoliable
        id: portfoliable-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are commits since the last root release tag
          latest_tag=$(git describe --tags --match "v*" --exclude "create-portfoliable-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            # No previous tags, compare to first commit
            latest_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          commits_since_last=$(git log ${latest_tag}..HEAD --oneline -- . --exclude='create-portfoliable' 2>/dev/null | wc -l)
          
          if [ "$commits_since_last" -gt 0 ]; then
            before=$(node -p "require('./package.json').version")
            npx semantic-release
            after=$(node -p "require('./package.json').version")
            if [ "$before" != "$after" ]; then
              echo "released=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No commits since last release, skipping"
          fi

      - name: Publish @portfoliablejs/portfoliable to GitHub Packages
        if: steps.portfoliable-release.outputs.released == 'true'
        run: |
          echo "@portfoliablejs:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release commit
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Release create-portfoliable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest create-portfoliable tag
          latest_tag=$(git describe --tags --match "create-portfoliable-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            latest_tag="HEAD~999"
          fi
          # Check if there are commits affecting create-portfoliable since the last tag
          commits_since_last=$(git log ${latest_tag}..HEAD --oneline -- create-portfoliable 2>/dev/null | wc -l)
          if [ "$commits_since_last" -gt 0 ]; then
            npx semantic-release --config ./create-portfoliable/.releaserc.json
          else
            echo "No commits affecting create-portfoliable since last release, skipping"
          fi
