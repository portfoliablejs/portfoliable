name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Initializer smoke
        run: npm run smoke:initializer

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release @portfoliablejs/portfoliable
        id: portfoliable-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x  # Enable debug output
          before=$(node -p "require('./package.json').version")
          echo "Version before: $before"
          echo "Git status:"
          git status
          echo "Running semantic-release..."
          npx semantic-release --debug 2>&1 || EXIT_CODE=$?
          after=$(node -p "require('./package.json').version")
          echo "Version after: $after"
          if [ "$before" != "$after" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
          fi
          exit ${EXIT_CODE:-0}

      - name: Publish @portfoliablejs/portfoliable to GitHub Packages
        if: steps.portfoliable-release.outputs.released == 'true'
        run: |
          echo "@portfoliablejs:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release commit
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Release create-portfoliable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd create-portfoliable
          npx semantic-release
