name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview version bumps without writing commits, tags, or releases
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.actor == 'schimanko'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Import GPG key for verified commits and tags
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -z "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "RELEASE_GPG_PRIVATE_KEY not set; proceeding without signed release commit/tag"
            echo "RELEASE_SIGN=false" >> $GITHUB_ENV
            exit 0
          fi
          if printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | base64 --decode > /tmp/release-private-key.asc 2>/dev/null; then
            true
          else
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > /tmp/release-private-key.asc
          fi
          gpg --batch --import /tmp/release-private-key.asc
          KEY_ID="$RELEASE_GPG_KEY_ID"
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2}' | awk -F/ '{print $2}' | head -n 1)
          fi
          if [ -z "$KEY_ID" ]; then
            echo "Could not determine signing key id"
            exit 1
          fi
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true
          git config tag.gpgsign true
          echo "RELEASE_SIGN=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Initializer smoke
        run: npm run smoke:initializer

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true

      - name: Configure git
        run: |
          git config user.name "schimanko"
          git config user.email "schimanko@users.noreply.github.com"

      - name: Compute release plan and apply versions
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> $GITHUB_OUTPUT
            node ./scripts/release-orchestrator.mjs --dry-run
          else
            echo "dry_run=false" >> $GITHUB_OUTPUT
            node ./scripts/release-orchestrator.mjs
          fi

      - name: Push release commit and tags
        if: steps.release-plan.outputs.released_any == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          git push origin main
          git push origin --tags

      - name: Setup npmjs.org publishing (OIDC)
        if: steps.release-plan.outputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@portfoliablejs'

      - name: Diagnostics for npm trusted publishing
        if: steps.release-plan.outputs.released_root == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "package=$PACKAGE_NAME"
          echo "registry=$(npm config get registry)"
          echo "scope_registry=$(npm config get @portfoliablejs:registry)"
          npm ping || true
          npm whoami || true
          REGISTRY="$(npm config get registry)"
          SCOPE_REGISTRY="$(npm config get @portfoliablejs:registry)"
          if [ "$REGISTRY" != "https://registry.npmjs.org/" ] && [ "$REGISTRY" != "https://registry.npmjs.org" ]; then
            echo "Unexpected npm registry: $REGISTRY"
            exit 1
          fi
          if [ -n "$SCOPE_REGISTRY" ] && [ "$SCOPE_REGISTRY" != "https://registry.npmjs.org/" ] && [ "$SCOPE_REGISTRY" != "https://registry.npmjs.org" ]; then
            echo "Unexpected @portfoliablejs scope registry: $SCOPE_REGISTRY"
            exit 1
          fi

      - name: Publish @portfoliablejs/portfoliable to npm
        if: steps.release-plan.outputs.released_root == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org

      - name: Setup GitHub Packages publishing
        if: steps.release-plan.outputs.released_root == 'true' && steps.release-plan.outputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@portfoliablejs'

      - name: Publish @portfoliablejs/portfoliable to GitHub Packages
        if: steps.release-plan.outputs.released_root == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: npm publish --access public --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish create-portfoliable to npm
        if: steps.release-plan.outputs.released_initializer == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          cd create-portfoliable
          npm publish --provenance --access public --registry=https://registry.npmjs.org

      - name: Create GitHub release for @portfoliablejs/portfoliable
        if: steps.release-plan.outputs.released_root == 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release-plan.outputs.root_tag }}"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"generate_release_notes\":true}"

      - name: Create GitHub release for create-portfoliable
        if: steps.release-plan.outputs.released_initializer == 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release-plan.outputs.initializer_tag }}"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"generate_release_notes\":true}"
