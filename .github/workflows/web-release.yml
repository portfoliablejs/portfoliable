# File: .github/workflows/web-release.yml
# Purpose: Build and deploy the web documentation site to GitHub Pages.
# Author: Lio Schimanko

# MARK: WORKFLOW NAME
name: Deploy Portfoliable Web

# MARK: TRIGGERS
on:
  push:
    branches:
      - main
    paths:
      - web/**
  workflow_dispatch:

# MARK: WORKFLOW PERMISSIONS
permissions:
  contents: read
  pages: write
  id-token: write

# MARK: CONCURRENCY CONTROL
concurrency:
  group: pages-portfoliable-web
  cancel-in-progress: true

# MARK: JOBS
jobs:
  build:
    runs-on: ubuntu-latest

    # MARK: BUILD STEPS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Valence
        uses: actions/checkout@v4
        with:
          repository: portfoliablejs/valence
          ref: 6d486efc58b6fc80c935d92246ad808d9a9905af
          path: valence

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            valence/package-lock.json

      - name: Install Valence dependencies
        run: npm --prefix ./valence ci

      - name: Build Valence Storybook
        env:
          STORYBOOK_BASE_PATH: ./
        run: npm --prefix ./valence run build-storybook

      - name: Install web dependencies
        run: npm --prefix ./web ci

      - name: Smoke check web content
        run: npm --prefix ./web run smoke

      - name: Build web site
        env:
          VITEPRESS_BASE: /
          SITE_HOSTNAME: https://portfoliable.js.org
        run: npm --prefix ./web run build

      - name: Add Valence to web artifact
        run: cp -R ./valence/storybook-static ./web/.vitepress/dist/valence

      - name: Verify Valence web route
        run: test -f ./web/.vitepress/dist/valence/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/.vitepress/dist

  # MARK: DEPLOY JOB
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Website
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
