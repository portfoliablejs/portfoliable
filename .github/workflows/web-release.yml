# File: .github/workflows/web-release.yml
# Purpose: Build and deploy the web documentation site to GitHub Pages.
# Author: Lio Schimanko

# MARK: WORKFLOW NAME
name: Deploy Portfoliable Web

# MARK: TRIGGERS
on:
  push:
    branches:
      - main
    paths:
      - web/**
  workflow_dispatch:

# MARK: WORKFLOW PERMISSIONS
permissions:
  contents: read
  pages: write
  id-token: write

# MARK: CONCURRENCY CONTROL
concurrency:
  group: pages-portfoliable-web
  cancel-in-progress: true

# MARK: JOBS
jobs:
  build:
    runs-on: ubuntu-latest

    # MARK: BUILD STEPS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix ./web ci

      - name: Smoke check web content
        run: npm --prefix ./web run smoke

      - name: Build web site
        run: npm --prefix ./web run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/.vitepress/dist

  # MARK: DEPLOY JOB
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Website
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
